<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Vault — a lantern-thief stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; height: 30px;
    display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: rgba(13, 15, 20, 0.92); color: #e8e4d8;
    font: 13px/1 Georgia, 'Times New Roman', serif; letter-spacing: 0.04em;
    pointer-events: none; z-index: 5;
  }
  #hud .spacer { flex: 1; }
  #hud-detect-wrap { display: flex; align-items: center; gap: 8px; }
  #hud-detect-bar { width: 130px; height: 9px; background: #2a2f3c; border: 1px solid #3a4152; }
  #hud-detect-fill { height: 100%; width: 0%; background: #ffd27a; }
  #hud-eye { color: #ffd27a; font-weight: bold; min-width: 52px; }
  #banner {
    position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
    display: none; padding: 8px 18px; background: rgba(13, 15, 20, 0.88);
    border: 1px solid #3a4152; color: #e8e4d8; z-index: 5;
    font: bold 16px Georgia, 'Times New Roman', serif; letter-spacing: 0.05em;
    pointer-events: none; white-space: nowrap;
  }
  #overlay {
    position: fixed; inset: 0; display: none; z-index: 10;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(8, 9, 12, 0.78); color: #e8e4d8; text-align: center; padding: 24px;
  }
  #overlay-title { font: bold 44px Georgia, 'Times New Roman', serif; color: #ffd27a; margin: 0 0 12px; letter-spacing: 0.08em; }
  #overlay-text { font: 17px/1.6 Georgia, 'Times New Roman', serif; max-width: 560px; margin: 0 0 22px; color: #cfc9ba; }
  #overlay-button {
    font: bold 18px Georgia, 'Times New Roman', serif; letter-spacing: 0.05em;
    color: #0d0f14; background: #ffd27a; border: none; padding: 12px 28px; cursor: pointer;
  }
  #overlay-button:hover { background: #ffe1a1; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Vault: a top-down stealth game. Steal the embers and reach the exit unseen."></canvas>
<div id="hud">
  <span id="hud-level">Level 1 · The Quiet Gallery</span>
  <span id="hud-shards">Embers 0/3</span>
  <span id="hud-coins">Coins 3</span>
  <span id="hud-time">00:00</span>
  <span class="spacer"></span>
  <span id="hud-detect-wrap"><span id="hud-eye">HIDDEN</span><span id="hud-detect-bar"><span id="hud-detect-fill" style="display:block"></span></span></span>
  <span id="hud-score">Score 0</span>
</div>
<div id="banner"></div>
<div id="overlay">
  <h1 id="overlay-title">EMBER VAULT</h1>
  <p id="overlay-text"></p>
  <button id="overlay-button" type="button">Begin the heist</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
